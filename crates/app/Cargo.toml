[package]
name = "faderust"
description = "Audio mixer for Windows with one mix per output"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
faderust-engine = { path = "../engine" }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
toml = "1.1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
