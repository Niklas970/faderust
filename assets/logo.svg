<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Faderust Logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg{fill:#ffffff;stroke:#cfd7dc;stroke-width:2}
    .rail{stroke:#cfd7dc;stroke-width:4;stroke-linecap:round}
    .cap{fill:#b4531c}
    .dot{fill:#0f766e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#171e24;stroke:#2b3641}
      .rail{stroke:#2b3641}
      .cap{fill:#ec8d5b}
      .dot{fill:#4fd1c0}
    }
  </style>
  <rect class="bg" x="2" y="2" width="60" height="60" rx="15"/>
  <line class="rail" x1="19" y1="14" x2="19" y2="50"/>
  <line class="rail" x1="32" y1="14" x2="32" y2="50"/>
  <line class="rail" x1="45" y1="14" x2="45" y2="50"/>
  <rect class="cap" x="12" y="31" width="14" height="8" rx="2.5"/>
  <rect class="cap" x="25" y="20" width="14" height="8" rx="2.5"/>
  <rect class="cap" x="38" y="37" width="14" height="8" rx="2.5"/>
  <circle class="dot" cx="32" cy="46" r="2.4"/>
</svg>
