name: Release

# Builds the Windows installer (NSIS setup, see installer/faderust.nsi) and the
# Stream Deck plugin. Runs on a version tag (v*), by hand from the Actions tab,
# or as a dry run (setup as workflow artifact, no release) on pull requests
# that touch the packaging or the window.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create, e.g. v0.1.0-alpha.1
        required: true
      title:
        description: Release title
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md
      - installer/**
      - crates/gui/**
      - crates/core/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json
      # Stream Deck runs the plugin on its own Node 24; building works here.
      # The setup ships the plugin too (so the app can update it), which puts
      # it under the updater's signature: build it before the setup.
      - run: npm ci && npm run build && npm run pack
        working-directory: streamdeck
      - name: Ship the plugin with the app
        run: |
          mkdir -p stage/resources
          cp streamdeck/dist/*.streamDeckPlugin stage/resources/
          jq -r .Version streamdeck/com.niklas970.faderust.sdPlugin/manifest.json \
            > stage/resources/streamdeck-plugin.version
      - run: cargo build --release -p faderust-iced
      - name: Build setup
        run: |
          choco install nsis -y --no-progress
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          "/c/Program Files (x86)/NSIS/makensis.exe" -V2 \
            "-DVERSION=$VERSION" \
            "-DEXE=$(cygpath -aw target/release/faderust-iced.exe)" \
            "-DRESOURCES=$(cygpath -aw stage/resources)" \
            "-DOUTFILE=$(cygpath -w "$PWD/Faderust_${VERSION}_x64-setup.exe")" \
            installer/faderust.nsi
      # The in-app updater checks this signature. Pull request runs do not get
      # the key (they only prove the build); forks have none.
      - name: Sign setup
        if: github.event_name != 'pull_request'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx --yes @tauri-apps/cli@2.12.4 signer sign "Faderust_${VERSION}_x64-setup.exe"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: faderust-setup
          path: Faderust_*_x64-setup.exe
          if-no-files-found: error
      # Everything the release job publishes, in one place.
      - name: Collect release files
        if: github.event_name != 'pull_request'
        run: |
          mkdir release
          cp Faderust_*_x64-setup.exe Faderust_*_x64-setup.exe.sig release/
          cp streamdeck/dist/*.streamDeckPlugin release/
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: release-files
          path: release/*
          if-no-files-found: error

  # Separate job so only it can write to the repository.
  release:
    needs: installer
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TITLE: ${{ inputs.title || github.ref_name }}
        run: |
          cd release
          setup=$(ls *-setup.exe)
          [ -f "$setup.sig" ] || { echo "Signing key missing: no updater signature"; exit 1; }
          # Manifest the in-app updater reads from the latest release.
          jq -n \
            --arg version "$(grep -m1 '^version' "$GITHUB_WORKSPACE/Cargo.toml" | sed -E 's/.*"(.*)".*/\1/')" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$setup.sig")" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$setup" \
            '{version: $version, pub_date: $date, notes: "", platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' \
            > latest.json
          # Not a prerelease: the updater only sees the latest full release.
          gh release create "$TAG" "$setup" "$setup.sig" latest.json \
            *.streamDeckPlugin \
            --title "$TITLE" \
            --notes-file "$GITHUB_WORKSPACE/.github/release-notes.md" \
            --target "$GITHUB_SHA" \
            --latest
