# cargo-deny config: https://embarkstudios.github.io/cargo-deny/
# Faderust is MIT-licensed; only permissive dependency licenses are allowed.

# Faderust only ships for Windows; Linux/macOS-only crates (e.g. GTK) don't count.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Permissive, pulled in by iced (clipboard, wgpu shader parser).
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"

[advisories]
yanked = "deny"
# Unmaintained (not vulnerable) crates that iced/wgpu depend on; they have no
# replacement there yet. Revisit when iced updates.
ignore = [
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2026-0192", # ttf-parser
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
