name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format and Clippy run next to the tests instead of before them: both need
  # their own build, so one job spent ~80 s of its 150 s on them in a row.
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Keeps its name: it is the check a branch rule may require.
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # Experimental USB cable: a test build for trying it on a real machine.
      - run: cargo build --release -p faderust-usbcable --example serve
      - uses: actions/upload-artifact@v7
        with:
          name: faderust-usbcable-test
          path: target/release/examples/serve.exe
          if-no-files-found: error
      # The program itself, for trying it on Windows without the setup.
      - run: cargo build --release -p faderust
      - uses: actions/upload-artifact@v7
        with:
          name: faderust
          path: target/release/faderust.exe
          if-no-files-found: error

  streamdeck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamdeck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v7
        with:
          name: faderust-streamdeck
          path: streamdeck/dist/*.streamDeckPlugin
          if-no-files-found: error

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
