name: Release

# Builds the Windows MSI. Runs on a version tag (v*), by hand from the
# Actions tab, or as a dry run (MSI as workflow artifact, no release) on
# pull requests that touch the packaging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create, e.g. v0.1.0-alpha.1
        required: true
      title:
        description: Release title
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md
      - crates/app/tauri.conf.json

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  msi:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/app/ui/package-lock.json
      - run: npm ci
        working-directory: crates/app/ui
      - run: npm run build
        working-directory: crates/app/ui
      # The Tauri CLI downloads WiX itself.
      - run: ui/node_modules/.bin/tauri build --bundles msi
        working-directory: crates/app
      - uses: actions/upload-artifact@v4
        with:
          name: faderust-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Create release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TITLE: ${{ inputs.title || github.ref_name }}
        run: |
          gh release create "$TAG" target/release/bundle/msi/*.msi \
            --title "$TITLE" \
            --notes-file .github/release-notes.md \
            --target "$GITHUB_SHA" \
            --prerelease
