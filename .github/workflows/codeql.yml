name: "CodeQL Advanced"

# Advanced setup with a path filter (the template cannot do that): on pull requests
# each language is only analysed when its own files changed. The Rust analysis
# is the slowest check by far (about 6 minutes). Pushes to main and the weekly
# run always analyse everything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 11 * * 5"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            # Source and manifests; the lock file decides what gets compiled.
            files: '\.rs$|(^|/)Cargo\.(toml|lock)$|^\.github/workflows/codeql\.yml$'
          - language: javascript-typescript
            files: '^(crates/app/ui|streamdeck)/|^\.github/workflows/codeql\.yml$'
          - language: actions
            files: '^\.github/|^\.github/workflows/codeql\.yml$'
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit of a pull request and its first parent (the base).
          fetch-depth: 2
      # The check stays green when nothing relevant changed, so a branch rule
      # that requires it is not left waiting.
      - name: Does this pull request touch ${{ matrix.language }}?
        id: scope
        env:
          FILES: ${{ matrix.files }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
            && ! git diff --name-only HEAD^1 HEAD | grep -Eq "$FILES"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No ${{ matrix.language }} files changed: skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: github/codeql-action/init@v4
        if: steps.scope.outputs.run == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        if: steps.scope.outputs.run == 'true'
        with:
          category: /language:${{ matrix.language }}
