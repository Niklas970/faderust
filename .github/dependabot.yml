version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # windows-core must match the `windows` crate (0.62 is its newest
      # release) and the copies cpal and iced use: bumping it alone breaks
      # the COM `implement` macro.
      - dependency-name: windows-core
      - dependency-name: windows
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /crates/app/ui
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /streamdeck
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 (native) has no JavaScript API, which
      # @rollup/plugin-typescript needs: the build fails on it.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
