# cargo-deny config: https://embarkstudios.github.io/cargo-deny/
# Faderust is MIT-licensed; only permissive dependency licenses are allowed.

# Faderust only ships for Windows; Linux/macOS-only crates (e.g. GTK) don't count.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

# Weak-copyleft (file-level) crates that Tauri pulls in unmodified. Allowed
# per crate only, so a new MPL dependency still fails the check.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "allow"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
