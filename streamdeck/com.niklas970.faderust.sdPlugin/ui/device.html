<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Standardgerät</title>
    <link rel="stylesheet" href="pi.css" />
  </head>
  <body>
    <div id="status" class="status" hidden>Faderust läuft nicht. Starte Faderust, dann erscheinen hier die Auswahllisten.</div>
    <div class="item"><label for="id">Gerät</label><select id="id" data-setting="id" data-source="devices"></select></div>
    <div class="item"><label></label><label class="check"><input type="checkbox" data-setting="communications" />Nur für Anrufe (Kommunikation)</label></div>
    <p class="hint">Die Taste leuchtet, solange das Gerät der Windows-Standard ist.</p>
    <script src="pi.js"></script>
  </body>
</html>
