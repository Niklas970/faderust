name: "CodeQL Advanced"

# Advanced setup with a path filter (the template cannot do that): on pull
# requests and pushes to main, each language is only analysed when its own files
# changed. The Rust analysis is the slowest check by far (about 6 minutes), and
# it ran again on main after every merge. The weekly run (and a manual one)
# always analyses everything, so nothing goes stale.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 11 * * 5"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            # Source and manifests; the lock file decides what gets compiled.
            files: '\.rs$|(^|/)Cargo\.(toml|lock)$|^\.github/workflows/codeql\.yml$'
          - language: javascript-typescript
            files: '^streamdeck/|^\.github/workflows/codeql\.yml$'
          - language: actions
            files: '^\.github/|^\.github/workflows/codeql\.yml$'
    steps:
      - uses: actions/checkout@v7
        with:
          # Whole history: a push needs the commit before it, a pull request
          # its base. The repository is small.
          fetch-depth: 0
      # The check stays green when nothing relevant changed, so a branch rule
      # that requires it is not left waiting.
      - name: Does this change touch ${{ matrix.language }}?
        id: scope
        env:
          FILES: ${{ matrix.files }}
          BEFORE: ${{ github.event.before }}
        run: |
          range=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="HEAD^1 HEAD"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # Not for the first push of a branch or after a force push, where
            # the previous commit is missing: those analyse everything.
            range="$BEFORE $GITHUB_SHA"
          fi
          if [ -n "$range" ] && ! git diff --name-only $range | grep -Eq "$FILES"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No ${{ matrix.language }} files changed: skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: github/codeql-action/init@v4
        if: steps.scope.outputs.run == 'true'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        if: steps.scope.outputs.run == 'true'
        with:
          category: /language:${{ matrix.language }}
