[package]
name = "faderust-engine"
description = "Audio engine for Faderust: device I/O, ring buffers, mix matrix"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["cpal"]
# Device backend built on cpal (WASAPI on Windows). Without it the engine core
# still builds and tests on any platform.
cpal = ["dep:cpal"]

[dependencies]
audioadapter-buffers = "5.1"
cpal = { version = "0.18", optional = true }
rtrb = "0.4"
rubato = { version = "5.0", default-features = false }

# Per-program output routing (apps::wasapi). Same version cpal uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Shell_PropertiesSystem",
] }

[[example]]
name = "e0_passthrough"
required-features = ["cpal"]

[[example]]
name = "mixer"
required-features = ["cpal"]
