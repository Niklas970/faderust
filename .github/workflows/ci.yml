name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/app/ui/package-lock.json
      # The app embeds the built UI at compile time.
      - run: npm ci
        working-directory: crates/app/ui
      - run: npm run build
        working-directory: crates/app/ui
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Experimental USB cable: a test build for trying it on a real machine.
      - run: cargo build --release -p faderust-usbcable --example serve
      - uses: actions/upload-artifact@v7
        with:
          name: faderust-usbcable-test
          path: target/release/examples/serve.exe
          if-no-files-found: error

  streamdeck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamdeck
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: streamdeck/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v7
        with:
          name: faderust-streamdeck
          path: streamdeck/dist/*.streamDeckPlugin
          if-no-files-found: error

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
