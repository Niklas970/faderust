name: Release

# Builds the Windows installer (NSIS setup) and the Stream Deck plugin. Runs
# on a version tag (v*), by hand from the Actions tab, or as a dry run (setup
# as workflow artifact, no release) on pull requests that touch the packaging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create, e.g. v0.1.0-alpha.1
        required: true
      title:
        description: Release title
        required: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md
      - crates/app/tauri.conf.json

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            crates/app/ui/package-lock.json
            streamdeck/package-lock.json
      - run: npm ci
        working-directory: crates/app/ui
      - run: npm run build
        working-directory: crates/app/ui
      # The Tauri CLI downloads NSIS itself. The installer follows the
      # Windows display language (English or German).
      - run: ui/node_modules/.bin/tauri build --bundles nsis
        working-directory: crates/app
      - uses: actions/upload-artifact@v4
        with:
          name: faderust-setup
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      # Stream Deck runs the plugin on its own Node 24; building works here.
      - run: npm ci && npm run build && npm run pack
        working-directory: streamdeck
      - name: Create release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TITLE: ${{ inputs.title || github.ref_name }}
        run: |
          gh release create "$TAG" target/release/bundle/nsis/*-setup.exe \
            streamdeck/dist/*.streamDeckPlugin \
            --title "$TITLE" \
            --notes-file .github/release-notes.md \
            --target "$GITHUB_SHA" \
            --prerelease
